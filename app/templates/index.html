<!DOCTYPE html>
<html>

<head>
    <title>Log Analyzer</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body
    class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 flex items-center justify-center p-6">

    <div
        class="bg-white/10 backdrop-blur-lg border border-white/20 shadow-2xl rounded-3xl p-10 w-full max-w-2xl text-white">

        <div class="text-center mb-10">

            <h1 class="text-5xl font-extrabold mb-4 tracking-tight">
                📊 Log Analyzer
            </h1>

            <p class="text-lg text-gray-200">
                Upload application logs and instantly visualize
                errors, warnings, trends, and operational insights.
            </p>

        </div>

        <form action="/upload" enctype="multipart/form-data" method="post" class="flex flex-col gap-6">

            <input type="file" name="filex"
                class="bg-white text-gray-800 rounded-xl p-4 border border-gray-300 shadow-sm">

            <button type="submit"
                class="bg-blue-500 hover:bg-blue-600 transition-all duration-300 text-white text-lg font-semibold py-4 rounded-xl shadow-lg hover:scale-[1.02]">
                Upload & Analyze Logs
            </button>

        </form>

        <div class="grid grid-cols-3 gap-4 mt-10 text-center">

            <div class="bg-white/10 rounded-xl p-4">
                <h3 class="text-2xl font-bold">⚡</h3>
                <p class="mt-2 text-sm">Fast Parsing</p>
            </div>

            <div class="bg-white/10 rounded-xl p-4">
                <h3 class="text-2xl font-bold">📈</h3>
                <p class="mt-2 text-sm">Live Analytics</p>
            </div>

            <div class="bg-white/10 rounded-xl p-4">
                <h3 class="text-2xl font-bold">🛡️</h3>
                <p class="mt-2 text-sm">Error Tracking</p>
            </div>

        </div>

    </div>

</body>

</html>
